name: Quest database contracts

on:
  schedule:
    # Check the newest Supabase CLI weekly without changing the release pin.
    - cron: "17 7 * * 1"
  pull_request:
    paths:
      - ".github/workflows/quest-database.yml"
      - "artifacts/mobile/__tests__/questRpc.integration.test.ts"
      - "artifacts/mobile/features/quests/**"
      - "artifacts/mobile/lib/supabase/**"
      - "artifacts/mobile/package.json"
      - "artifacts/mobile/scripts/quest-database-check.sh"
      - "artifacts/mobile/supabase/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/quest-database.yml"
      - "artifacts/mobile/__tests__/questRpc.integration.test.ts"
      - "artifacts/mobile/features/quests/**"
      - "artifacts/mobile/lib/supabase/**"
      - "artifacts/mobile/package.json"
      - "artifacts/mobile/scripts/quest-database-check.sh"
      - "artifacts/mobile/supabase/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:
    inputs:
      supabase_cli_version:
        description: "Candidate Supabase CLI version (for example 2.116.0 or latest)"
        required: false
        default: latest
        type: string

permissions:
  contents: read

jobs:
  quest-database:
    name: Quest RPC and RLS contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the release candidate
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Keep this pinned. Update deliberately by running the local
          # disposable check and the Quest RPC/RLS suite first; see
          # artifacts/mobile/docs/QUEST_LIVE_TESTING.md.
          version: 2.115.0

      - name: Apply migrations and run Quest contracts
        run: bash artifacts/mobile/scripts/quest-database-check.sh

  quest-database-candidate:
    name: Candidate Supabase CLI compatibility
    # This is intentionally a separate job: failures here should surface a
    # candidate incompatibility without blocking the release gate's pinned job.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the release candidate
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up candidate Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ inputs.supabase_cli_version || 'latest' }}

      - name: Apply migrations and run Quest contracts against candidate
        env:
          # "latest" is resolved by setup-cli and the harness prints the
          # concrete installed version. An explicit version is checked exactly.
          SUPABASE_CLI_VERSION: ${{ inputs.supabase_cli_version || 'latest' }}
        run: bash artifacts/mobile/scripts/quest-database-check.sh

  report-quest-database-candidate-failure:
    name: Report candidate Supabase CLI incompatibility
    needs: quest-database-candidate
    if: >-
      always() &&
      needs.quest-database-candidate.result == 'failure' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create or update the compatibility alert
        uses: actions/github-script@v7
        env:
          CANDIDATE_VERSION: ${{ inputs.supabase_cli_version || 'latest' }}
        with:
          script: |
            const title = "[CI Alert] Supabase CLI candidate compatibility failure";
            const repoUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const runUrl = `${repoUrl}/actions/runs/${context.runId}`;
            const promotionGuide = `${repoUrl}/blob/main/artifacts/mobile/docs/QUEST_LIVE_TESTING.md#updating-the-supabase-cli-pin`;
            const candidate = process.env.CANDIDATE_VERSION;
            const body = [
              "## Supabase CLI candidate compatibility failure",
              "",
              "**Owner:** Quest database and release maintainers",
              `**Candidate:** \`${candidate}\``,
              `**Failed run:** [Open the failed workflow run](${runUrl})`,
              `**Promotion process:** [Review the CLI promotion guide](${promotionGuide})`,
              "",
              "The scheduled candidate check found that this CLI candidate cannot apply the checked-in migrations or pass the Quest contract suite. Keep the pinned release CLI unchanged until the candidate is investigated and the promotion process is completed.",
              "",
              `Last updated by workflow run ${context.runId}.`
            ].join("\n");

            const { data: existing } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
              per_page: 10
            });
            const alert = existing.items.find((issue) => issue.title === title);

            if (alert) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: alert.number,
                body
              });
              core.info(`Updated compatibility alert #${alert.number}.`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
              core.info(`Created compatibility alert #${created.number}.`);
            }
