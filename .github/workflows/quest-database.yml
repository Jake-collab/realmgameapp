name: Quest database contracts

on:
  schedule:
    # Check the newest Supabase CLI weekly without changing the release pin.
    - cron: "17 7 * * 1"
  pull_request:
    paths:
      - ".github/workflows/quest-database.yml"
      - "artifacts/mobile/__tests__/questRpc.integration.test.ts"
      - "artifacts/mobile/features/quests/**"
      - "artifacts/mobile/lib/supabase/**"
      - "artifacts/mobile/package.json"
      - "artifacts/mobile/scripts/quest-database-check.sh"
      - "artifacts/mobile/supabase/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/quest-database.yml"
      - "artifacts/mobile/__tests__/questRpc.integration.test.ts"
      - "artifacts/mobile/features/quests/**"
      - "artifacts/mobile/lib/supabase/**"
      - "artifacts/mobile/package.json"
      - "artifacts/mobile/scripts/quest-database-check.sh"
      - "artifacts/mobile/supabase/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:
    inputs:
      supabase_cli_version:
        description: "Candidate Supabase CLI version (for example 2.116.0 or latest)"
        required: false
        default: latest
        type: string

permissions:
  contents: read

jobs:
  quest-database:
    name: Quest RPC and RLS contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the release candidate
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Keep this pinned. Update deliberately by running the local
          # disposable check and the Quest RPC/RLS suite first; see
          # artifacts/mobile/docs/QUEST_LIVE_TESTING.md.
          version: 2.115.0

      - name: Apply migrations and run Quest contracts
        run: bash artifacts/mobile/scripts/quest-database-check.sh



  quest-database-candidate:
    name: Candidate Supabase CLI compatibility
    # This is intentionally a separate job: failures here should surface a
    # candidate incompatibility without blocking the release gate's pinned job.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the release candidate
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up candidate Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ inputs.supabase_cli_version || 'latest' }}

      - name: Apply migrations and run Quest contracts against candidate
        env:
          # "latest" is resolved by setup-cli and the harness prints the
          # concrete installed version. An explicit version is checked exactly.
          SUPABASE_CLI_VERSION: ${{ inputs.supabase_cli_version || 'latest' }}
        run: bash artifacts/mobile/scripts/quest-database-check.sh