openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: admin
    description: Staff-only Worlds operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Resolve the current staff session
      responses:
        "200":
          description: Staff access state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Get operational dashboard summaries
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List users for staff review
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated user summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
  /admin/quests:
    get:
      operationId: listAdminQuests
      tags: [admin]
      summary: List quests for staff review
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/QuestStatus"
        - $ref: "#/components/parameters/QuestType"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated quest summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuestPage"
  /admin/review-queues:
    get:
      operationId: getAdminReviewQueues
      tags: [admin]
      summary: Get moderation queue counts and recent cases
      responses:
        "200":
          description: Review queue summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReviewQueues"
  /admin/audit:
    get:
      operationId: listAdminAuditLogs
      tags: [admin]
      summary: List append-only staff audit events
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditPage"
  /admin/diagnostics:
    get:
      operationId: getAdminDiagnostics
      tags: [admin]
      summary: Get safe platform diagnostics
      responses:
        "200":
          description: Diagnostics without secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDiagnostics"
  /admin/moderation/diagnostics:
    get:
      operationId: getAdminModerationDiagnostics
      tags: [admin]
      summary: Get safe moderation provider diagnostics
      responses:
        "200":
          description: Provider status without secrets
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { description: Authentication required }
        "403": { description: Permission denied }
  /admin/moderation/scan/text:
    post:
      operationId: scanAdminModerationText
      tags: [admin]
      summary: Scan text through the server moderation policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, context]
              properties:
                text: { type: string, maxLength: 12000 }
                context: { type: string, enum: [public_text, ai_quest, profile, private_proof] }
                accountInGoodStanding: { type: boolean }
                reported: { type: boolean }
      responses:
        "200":
          description: Normalized moderation outcome
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { description: Invalid scan request }
        "401": { description: Authentication required }
        "403": { description: Permission denied }
  /admin/moderation/scan/image:
    post:
      operationId: scanAdminModerationImage
      tags: [admin]
      summary: Scan image metadata through the server moderation policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [context]
              properties:
                contentHash: { type: string, pattern: "^[a-f0-9]{64}$" }
                mediaUrl: { type: string, maxLength: 2048 }
                context: { type: string, enum: [public_media, private_proof, profile] }
                accountInGoodStanding: { type: boolean }
                reported: { type: boolean }
      responses:
        "200":
          description: Normalized moderation outcome
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { description: Invalid scan request }
        "401": { description: Authentication required }
        "403": { description: Permission denied }
  /admin/integrity/evaluate:
    post:
      operationId: evaluateAdminIntegrityRisk
      tags: [admin]
      summary: Calculate a privacy-safe integrity risk result
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Risk snapshot for staff systems
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { description: Invalid integrity signals }
        "401": { description: Authentication required }
        "403": { description: Permission denied }
  /admin/reports/triage:
    post:
      operationId: triageAdminReport
      tags: [admin]
      summary: Calculate explainable report priority
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Review priority result
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /admin/ai/overview:
    get:
      operationId: getAdminAiOverview
      tags: [admin]
      summary: Get safe AI generation overview
      responses:
        "200":
          description: AI overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAiOverview" }
        "401": { description: Authentication required }
        "403": { description: Permission denied }
        "503": { description: AI or staff service unavailable }
  /admin/ai/prompts:
    get:
      operationId: listAdminAiPrompts
      tags: [admin]
      summary: List versioned Quest prompt templates
      responses:
        "200":
          description: Prompt versions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAiPromptPage" }
  /admin/ai/prompts/{type}:
    get:
      operationId: listAdminAiPromptVersions
      tags: [admin]
      summary: List prompt versions for a Quest type
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string, enum: [daily, monthly, geo] }
      responses:
        "200":
          description: Prompt versions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAiPromptPage" }
  /admin/ai/prompts/{type}/versions/{version}/{action}:
    post:
      operationId: changeAdminAiPromptVersionState
      tags: [admin]
      summary: Activate, deactivate, or restore a prompt version
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string, enum: [daily, monthly, geo] }
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [activate, deactivate, restore] }
      responses:
        "200":
          description: Updated prompt version
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { description: Invalid lifecycle operation }
        "401": { description: Authentication required }
        "403": { description: Permission denied }
        "404": { description: Prompt version not found }
  /admin/ai/generate:
    post:
      operationId: generateAdminAiQuest
      tags: [admin]
      summary: Generate reviewable Quest candidates
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAiGenerationRequest" }
      responses:
        "200":
          description: Candidate or safe unavailable result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAiGenerationResponse" }
        "401": { description: Authentication required }
        "403": { description: Permission denied }
        "503": { description: AI or staff service unavailable }
  /admin/ai/history:
    get:
      operationId: listAdminAiHistory
      tags: [admin]
      summary: List AI generation history
      responses:
        "200":
          description: Generation history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAiHistory" }
  /admin/ai/settings:
    get:
      operationId: getAdminAiSettings
      tags: [admin]
      summary: Get safe AI settings
      responses:
        "200":
          description: Settings without secrets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAiSettings" }
components:
  parameters:
    Search:
      name: search
      in: query
      schema:
        type: string
      required: false
    Status:
      name: status
      in: query
      schema:
        type: string
      required: false
    QuestStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [draft, pending_review, approved, scheduled, published, paused, expired, archived, rejected]
      required: false
    QuestType:
      name: type
      in: query
      schema:
        type: string
        enum: [daily, monthly, geo]
      required: false
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      required: false
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      required: false
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AdminSession:
      type: object
      required: [authenticated, authorized, role, permissions]
      properties:
        authenticated: { type: boolean }
        authorized: { type: boolean }
        role:
          type: string
          enum: [user, creator, moderator, admin, super_admin]
        displayName: { type: ["string", "null"] }
        username: { type: ["string", "null"] }
        permissions:
          type: array
          items: { type: string }
        reason:
          type: ["string", "null"]
    AdminMetric:
      type: object
      required: [label, value, status]
      properties:
        label: { type: string }
        value: { type: [integer, "null"] }
        status:
          type: string
          enum: [available, unavailable]
        detail: { type: ["string", "null"] }
    AdminAiOverview:
      type: object
      additionalProperties: true
      required: [provider, promptTemplates, generationPolicy, generatedAt]
      properties:
        provider: { type: object, additionalProperties: true }
        promptTemplates: { type: array, items: { type: object, additionalProperties: true } }
        generationPolicy: { type: string }
        generatedAt: { type: string, format: date-time }
    AdminAiPromptPage:
      type: object
      additionalProperties: true
      required: [items]
      properties:
        items: { type: array, items: { type: object, additionalProperties: true } }
    AdminAiGenerationRequest:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [daily, monthly, geo] }
        variables: { type: object, additionalProperties: { type: string } }
        testOnly: { type: boolean, default: true }
        quantity: { type: integer, minimum: 1, maximum: 20, default: 1 }
    AdminAiGenerationResponse:
      type: object
      additionalProperties: true
      required: [mode, results, saved]
      properties:
        mode: { type: string }
        results: { type: array, items: { type: object, additionalProperties: true } }
        saved: { type: boolean }
    AdminAiHistory:
      type: object
      additionalProperties: true
      required: [items]
      properties:
        items: { type: array, items: { type: object, additionalProperties: true } }
    AdminAiSettings:
      type: object
      additionalProperties: true
      required: [provider, settings]
      properties:
        provider: { type: object, additionalProperties: true }
        settings: { type: object, additionalProperties: true }
    AdminDashboard:
      type: object
      required: [metrics, actionQueue, generatedAt]
      properties:
        metrics:
          type: array
          items: { $ref: "#/components/schemas/AdminMetric" }
        actionQueue:
          type: array
          items: { $ref: "#/components/schemas/AdminQueueItem" }
        generatedAt: { type: string, format: date-time }
    AdminQueueItem:
      type: object
      required: [id, category, title, priority, href]
      properties:
        id: { type: string }
        category: { type: string }
        title: { type: string }
        priority:
          type: string
          enum: [critical, high, normal]
        href: { type: string }
        age: { type: ["string", "null"] }
    AdminUser:
      type: object
      required: [id, displayName, username, role, accountStatus, createdAt]
      properties:
        id: { type: string }
        displayName: { type: string }
        username: { type: string }
        publicUserRef: { type: ["string", "null"] }
        role: { type: string }
        accountStatus: { type: string }
        createdAt: { type: string, format: date-time }
        lastActiveAt: { type: ["string", "null"], format: date-time }
        questCompletions: { type: ["integer", "null"] }
        huntCompletions: { type: ["integer", "null"] }
        totalPoints: { type: ["integer", "null"] }
        openCases: { type: ["integer", "null"] }
    AdminUserPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    AdminQuest:
      type: object
      required: [id, title, type, status, points, source, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        type: { type: string }
        status: { type: string }
        difficulty: { type: ["string", "null"] }
        points: { type: ["integer", "null"] }
        source: { type: string }
        completionCount: { type: ["integer", "null"] }
        reviewCount: { type: ["integer", "null"] }
        updatedAt: { type: string, format: date-time }
    AdminQuestPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminQuest" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    AdminReviewQueues:
      type: object
      required: [queues]
      properties:
        queues:
          type: array
          items: { $ref: "#/components/schemas/AdminQueueItem" }
    AdminAuditEvent:
      type: object
      required: [id, timestamp, action, entityType, result]
      properties:
        id: { type: string }
        timestamp: { type: string, format: date-time }
        actor: { type: ["string", "null"] }
        actorRole: { type: ["string", "null"] }
        action: { type: string }
        entityType: { type: string }
        entity: { type: ["string", "null"] }
        result: { type: string }
        reason: { type: ["string", "null"] }
    AdminAuditPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminAuditEvent" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    AdminDiagnostic:
      type: object
      required: [name, status, summary]
      properties:
        name: { type: string }
        status:
          type: string
          enum: [configured, missing, healthy, degraded, failed, unavailable]
        summary: { type: string }
        checkedAt: { type: ["string", "null"], format: date-time }
    AdminDiagnostics:
      type: object
      required: [checks, generatedAt]
      properties:
        checks:
          type: array
          items: { $ref: "#/components/schemas/AdminDiagnostic" }
        generatedAt: { type: string, format: date-time }

