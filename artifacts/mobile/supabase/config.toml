# Disposable local Supabase configuration used by the Quest database check.
# This database is recreated for every CI run; it must never be linked to a
# hosted or production Supabase project.
project_id = "quest-database-check"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[storage]
enabled = true

[auth]
enabled = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false