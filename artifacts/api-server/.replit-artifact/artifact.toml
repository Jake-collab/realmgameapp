kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# One Reserved VM owns the API and the existing trusted worker.
args = ["bash", "artifacts/api-server/scripts/start-production.sh"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
SCHEDULER_ENABLED = "true"
SCHEDULER_INTERVAL_SECONDS = "60"
SCHEDULER_MAINTENANCE_INTERVAL_SECONDS = "3600"
MODERATION_MEDIA_RETENTION_DAYS = "30"

[services.production.health.startup]
path = "/api/healthz"
